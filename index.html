<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Perfect Wheel</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:sans-serif;
    overflow:hidden;
}

.container{
    display:flex;
    height:100vh;
}

.sidebar{
    width:300px;
    background:#1b1b1b;
    padding:20px;
    box-sizing:border-box;
}

.sidebar h2{
    margin-top:0;
}

textarea{
    width:100%;
    height:300px;
    background:#222;
    color:white;
    border:none;
    padding:10px;
    font-size:16px;
    resize:none;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    font-size:18px;
    border:none;
    cursor:pointer;
    background:#4caf50;
    color:white;
}

button:hover{
    opacity:0.9;
}

.main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

#wrapper{
    position:relative;
    width:650px;
    height:650px;
}

#pointer{
    position:absolute;
    top:-15px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;

    border-left:25px solid transparent;
    border-right:25px solid transparent;
    border-top:50px solid red;

    z-index:100;
}

canvas{
    transition:
    transform 5s cubic-bezier(0.17,0.67,0.15,1);
}

#result{
    position:absolute;
    bottom:20px;
    font-size:40px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<div class="sidebar">

<h2>ตัวละคร</h2>

<textarea id="namesInput">lethe
lethe
lethe
lethe</textarea>

<button onclick="updateWheel()">
อัปเดตวงล้อ
</button>

<button onclick="spin()">
หมุนวงล้อ
</button>

</div>

<div class="main">

<div id="wrapper">

<div id="pointer"></div>

<canvas
id="wheelCanvas"
width="650"
height="650">
</canvas>

</div>

<div id="result"></div>

</div>

</div>

<script>

const canvas =
document.getElementById("wheelCanvas");

const ctx =
canvas.getContext("2d");

let names = [];

let currentRotation = 0;

function getNames(){

    return document
    .getElementById("namesInput")
    .value
    .split("\n")
    .map(x => x.trim())
    .filter(x => x !== "");

}

function drawWheel(){

    names = getNames();

    ctx.clearRect(0,0,650,650);

    if(names.length === 0) return;

    const centerX = 325;
    const centerY = 325;
    const radius = 310;

    const sliceAngle =
    (Math.PI * 2) / names.length;

    names.forEach((name,index)=>{

        const start =
        index * sliceAngle;

        const end =
        start + sliceAngle;

        
        ctx.beginPath();

        ctx.moveTo(centerX,centerY);

        ctx.arc(
            centerX,
            centerY,
            radius,
            start,
            end
        );

        ctx.fillStyle =
        `hsl(${index*360/names.length},70%,50%)`;

        ctx.fill();

        ctx.strokeStyle = "#111";
        ctx.lineWidth = 4;
        ctx.stroke();

        
        ctx.save();

        ctx.translate(centerX,centerY);

        ctx.rotate(start + sliceAngle/2);

        ctx.textAlign = "right";

        ctx.fillStyle = "white";

        ctx.font = "24px sans-serif";

        ctx.fillText(
            name,
            radius - 20,
            10
        );

        ctx.restore();

    });

}

function updateWheel(){

    drawWheel();

}

function secureRandom(max){

    const array =
    new Uint32Array(1);

    crypto.getRandomValues(array);

    return array[0] % max;

}

function spin(){

    names = getNames();

    if(names.length === 0) return;

    
    const winner =
    secureRandom(names.length);

    const sliceAngle =
    360 / names.length;

    
    const middleAngle =
    winner * sliceAngle + sliceAngle/2;

    
    
    const finalAngle =
    270 - middleAngle;

    
    currentRotation +=
    360 * 6 + finalAngle;

    canvas.style.transform =
    `rotate(${currentRotation}deg)`;

    setTimeout(()=>{

        document.getElementById("result")
        .innerText =
        "🎉 ได้: " + names[winner];

    },5000);

}

drawWheel();

</script>

</body>
</html>
